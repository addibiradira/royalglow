<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Glow: Modern Queen Makeover</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans dengan fallback rapi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           DESIGN TOKENS: MODERN ROYAL PALACE (CHAMPAGNE, MARBLE, ROSE & GOLD)
           ========================================================================== */
        :root {
            --bg-marble: #FAF6F3;
            --bg-marble-accent: #F2E8E3;
            --card-glass: rgba(255, 255, 255, 0.86);
            --card-border: rgba(197, 155, 95, 0.35);
            
            --gold-primary: #B88A44;
            --gold-light: #DFC08A;
            --gold-gradient: linear-gradient(135deg, #C99E57 0%, #E7CE9B 50%, #B38239 100%);
            
            --velvet-rose: #9E4761;
            --velvet-rose-soft: rgba(158, 71, 97, 0.12);
            --royal-navy: #1E2436;
            
            --text-dark: #262228;
            --text-muted: #6C636E;
            --shadow-royal: 0 12px 36px rgba(38, 34, 40, 0.08);
            --shadow-gold: 0 6px 20px rgba(184, 138, 68, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-marble);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(223, 192, 138, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(158, 71, 97, 0.14) 0%, transparent 50%),
                linear-gradient(160deg, #FCF9F7 0%, #F1E7E1 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* ==========================================================================
           HEADER & AUDIO CONTROLLER (BRITISH RUNWAY CHIC)
           ========================================================================== */
        header {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 1rem 1.25rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .crown-emblem {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
            box-shadow: var(--shadow-gold);
        }

        .brand-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--royal-navy);
        }

        .brand-title p {
            font-size: 0.76rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .music-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            padding: 0.45rem 0.85rem;
            border-radius: 99px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            backdrop-filter: blur(8px);
        }

        .music-btn {
            background: var(--royal-navy);
            color: #FFF;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .music-btn:hover {
            transform: scale(1.06);
            background: var(--velvet-rose);
        }

        .music-info {
            display: flex;
            flex-direction: column;
            padding-right: 0.4rem;
        }

        .music-track {
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--royal-navy);
        }

        .music-sub {
            font-size: 0.68rem;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .equalizer {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
        }

        .equalizer span {
            width: 2.5px;
            height: 3px;
            background: var(--velvet-rose);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .equalizer.playing span:nth-child(1) { animation: eq 0.55s infinite alternate; }
        .equalizer.playing span:nth-child(2) { animation: eq 0.4s infinite alternate 0.15s; }
        .equalizer.playing span:nth-child(3) { animation: eq 0.65s infinite alternate 0.3s; }

        @keyframes eq {
            0% { height: 3px; }
            100% { height: 10px; }
        }

        /* ==========================================================================
           STEPPER NAVIGASI 4 TAHAP + FINALE
           ========================================================================== */
        .stepper-container {
            width: 100%;
            max-width: 1180px;
            margin: 0.5rem auto;
            padding: 0 1.25rem;
        }

        .stepper {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            padding: 0.55rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-royal);
        }

        .step-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.6rem 0.5rem;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .step-pill .num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(108, 99, 110, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
        }

        .step-pill.active {
            background: var(--royal-navy);
            color: #FFF;
            box-shadow: 0 4px 12px rgba(30, 36, 54, 0.22);
        }

        .step-pill.active .num {
            background: var(--gold-primary);
            color: #FFF;
        }

        .step-pill.completed {
            color: var(--velvet-rose);
        }

        .step-pill.completed .num {
            background: var(--velvet-rose);
            color: #FFF;
        }

        /* ==========================================================================
           ARENA UTAMA: PANGGUNG AVATAR RATU & PANEL STUDIO
           ========================================================================== */
        .game-layout {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0.5rem 1.25rem 2rem;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
            gap: 1.5rem;
            flex: 1;
            align-items: stretch;
        }

        /* Kartu Avatar Ratu */
        .palace-stage {
            position: relative;
            border-radius: 24px;
            border: 1.5px solid var(--card-border);
            background: linear-gradient(180deg, #FBF7F4 0%, #EFE1D8 100%);
            box-shadow: var(--shadow-royal);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 540px;
            transition: background 0.8s ease;
        }

        /* Mode Latar Belakang Grand Ballroom saat Finale */
        .palace-stage.gala-mode {
            background: radial-gradient(circle at 50% 25%, #3B2B47 0%, #191C2B 70%, #0F111A 100%);
            border-color: #DFC08A;
        }

        .stage-top-badge {
            position: relative;
            z-index: 10;
            margin-top: 1rem;
            padding: 0.4rem 1rem;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--card-border);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--royal-navy);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        /* Kontainer SVG Interaktif */
        .queen-canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 420px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            cursor: pointer;
        }

        #queen-svg {
            width: 100%;
            height: auto;
            max-height: 455px;
            filter: drop-shadow(0 12px 24px rgba(38, 34, 40, 0.12));
        }

        /* Kursor Alat Skincare Melayang saat Aktif */
        #floating-tool {
            position: absolute;
            pointer-events: none;
            z-index: 30;
            font-size: 2rem;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            transition: transform 0.08s ease;
        }

        /* Layer Efek Partikel Kilau & Gelembung */
        #fx-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
            100% { transform: translate(-50%, -140%) scale(1.3); opacity: 0; }
        }

        /* Kilatan Kamera saat Finale */
        .camera-flash {
            position: absolute;
            inset: 0;
            background: #FFF;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }

        .camera-flash.flash-anim {
            animation: flashBurst 0.65s ease-out;
        }

        @keyframes flashBurst {
            0% { opacity: 0.85; }
            100% { opacity: 0; }
        }

        /* Dialog Visual Novel di Bawah Avatar */
        .dialogue-box {
            position: relative;
            z-index: 15;
            width: calc(100% - 2rem);
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 0.85rem 1.1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .dialogue-speaker {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--velvet-rose);
            margin-bottom: 0.2rem;
            display: flex;
            justify-content: space-between;
        }

        .dialogue-text {
            font-size: 0.86rem;
            line-height: 1.45;
            color: var(--text-dark);
        }

        /* ==========================================================================
           PANEL KONTROL MAKEOVER (KANAN)
           ========================================================================== */
        .studio-panel {
            background: var(--card-glass);
            border: 1.5px solid var(--card-border);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-royal);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.25rem;
        }

        .panel-header h2 {
            font-size: 1.45rem;
            color: var(--royal-navy);
            margin-bottom: 0.25rem;
        }

        .panel-header p {
            font-size: 0.86rem;
            color: var(--text-muted);
        }

        /* Progress Bar Khusus Skincare */
        .skincare-meter {
            background: rgba(184, 138, 68, 0.12);
            border-radius: 14px;
            padding: 0.85rem 1rem;
            margin-top: 0.75rem;
            border: 1px solid rgba(184, 138, 68, 0.25);
        }

        .meter-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.45rem;
            color: var(--royal-navy);
        }

        .meter-track {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.8);
            border-radius: 99px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: var(--gold-gradient);
            border-radius: 99px;
            transition: width 0.35s ease;
        }

        /* Grid Pilihan Alat & Item Fashion */
        .control-section {
            margin-bottom: 1rem;
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.55rem;
            display: block;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.65rem;
        }

        .tool-card {
            background: #FFF;
            border: 1.5px solid rgba(197, 155, 95, 0.28);
            border-radius: 14px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            position: relative;
        }

        .tool-card:hover {
            border-color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(184, 138, 68, 0.14);
        }

        .tool-card.active {
            border-color: var(--velvet-rose);
            background: var(--velvet-rose-soft);
            box-shadow: 0 4px 14px rgba(158, 71, 97, 0.16);
        }

        .tool-card.done::after {
            content: '✓';
            position: absolute;
            top: 8px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3D8B68;
            color: #FFF;
            font
